<!DOCTYPE html>
<html>
<head>
    <title>Ostracod Sketch Recognition</title>
    <link href="css/style.css" rel='stylesheet' type='text/css'/>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #myCanvas {
            display: block;
            background-color: white;
        }
    </style>
</head>
<body>
    <canvas id="myCanvas" resize="true"></canvas>
    <div style="position:fixed;top:0px;left:0px">
        <label id="questionlabel">Draw Maximum Length</label>
    </div>
    <div id="out" style="position:fixed;top:20px;right:0px;">
        <label id="output">Output</label>
    </div>
    <div style="position:fixed;top:0px;right:0px" id="filebutton">
        <input type="file" id="myFile" onchange="window.APP && window.APP.setBackground()">
        <button id="process" onclick="window.APP && window.APP.process()">Process Outline</button>
    </div>

    <!-- External Libraries -->
    <script src="js/require.js"></script>
    <script src="js/srlib.js"></script>
    <script src="js/paper-full.js" type="text/javascript"></script>

    <!-- Application Scripts (ES6 Module) -->
    <script type="module">
        // Import all functions from modules
        import { Point, initializeDelta, initializeTheta, removeDuplicatePoints } from './js/utils.js';
        import { 
            findCentroid, 
            findHalves, 
            rotateOutline, 
            findVerticalDistances, 
            determineValveSide 
        } from './js/shapeAnalysis.js';
        import { extractMorphologicalFeatures, calculateStrokeLengths } from './js/featureExtraction.js';
        import { predict } from './js/classifier.js';

        // Install Paper.js as global FIRST
        paper.install(window);

        // ==================== STATE MANAGEMENT ====================
        const AppState = {
            strokeCount: 0,
            maxLength1: null,
            maxLength2: null,
            inputSpecie: null,
            path: null,
            userDefineMaxLength: null,
            centroidCircle: null,
            sketch: null,
            stroke: null,

            reset() {
                if (this.path) this.path.remove();
                if (this.userDefineMaxLength) this.userDefineMaxLength.remove();
                if (this.centroidCircle) this.centroidCircle.remove();
                this.sketch = null;
                this.stroke = null;
                this.userDefineMaxLength = new Path();
                this.path = new Path();
                this.strokeCount = 0;
            }
        };

        // ==================== GLOBAL APP OBJECT ====================
        window.APP = {
            AppState,
            backgroundRaster: null,

            setBackground() {
                const fileInput = document.getElementById("myFile");
                const files = fileInput.files;
                
                if (files && files.length > 0) {
                    const file = files[0];
                    const x = file.name;
                    const name = x.split("\\");
                    console.log(name[name.length - 1]);
                    AppState.inputSpecie = name[name.length - 1];
                    
                    // Use FileReader to load image as data URL
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        document.getElementById("myCanvas").style.backgroundImage = "url(" + e.target.result + ")";
                    };
                    reader.readAsDataURL(file);
                    
                    // Reset state
                    if (AppState.path) AppState.path.remove();
                    if (AppState.userDefineMaxLength) AppState.userDefineMaxLength.remove();
                    if (AppState.centroidCircle) AppState.centroidCircle.remove();
                    AppState.sketch = null;
                    AppState.stroke = null;
                    AppState.userDefineMaxLength = new Path();
                    AppState.path = new Path();
                    AppState.strokeCount = 0;
                    document.getElementById('output').innerHTML = '';
                }
            },

            process() {
                if (!AppState.sketch) {
                    alert('Please trace the outline first');
                    return;
                }

                try {
                    document.getElementById('questionlabel').innerHTML = 'Processing...';

                    // Get all points
                    let points = [];
                    for (const keypoint in AppState.sketch.getPoints()) {
                        points.push(AppState.sketch.getPoints()[keypoint]);
                    }

                    // Remove consecutive duplicates
                    for (let j = 1; j < points.length; j++) {
                        if (points[j].getX() == points[j - 1].getX() && points[j].getY() == points[j - 1].getY()) {
                            points.splice(j, 1);
                            j = j - 1;
                        }
                    }

                    // Calculate deltas and thetas
                    const { deltaX, deltaY } = initializeDelta(points);
                    const theta = initializeTheta(deltaX, deltaY);

                    let rotation = 0.0, smoothness = 0.0, sharpness = 0.0;
                    for (let j = 0; j < theta.length; j++) {
                        rotation = rotation + theta[j];
                        smoothness = smoothness + Math.abs(theta[j]);
                        sharpness = sharpness + Math.pow(theta[j], 2);
                    }

                    const maxpoints = [AppState.maxLength1, AppState.maxLength2];
                    const centroid = findCentroid(AppState.sketch);
                    AppState.centroidCircle = new Path.Circle(new Point(centroid.getX(), centroid.getY()), 20);
                    AppState.centroidCircle.strokeColor = 'red';

                    // Rotate the outline
                    const newEverything = rotateOutline(AppState.sketch, maxpoints);
                    const newSketch = newEverything[0];
                    const newmaxpoints = [newEverything[1], newEverything[2]];
                    const newCentroid = findCentroid(newSketch);

                    let newPoints = [];
                    for (const key in newSketch.getPoints()) {
                        newPoints.push(newSketch.getPoints()[key]);
                    }

                    // Calculate stroke lengths
                    const { totalLength, topLength, bottomLength } = calculateStrokeLengths(newPoints, newmaxpoints);
                    const topStrokeLength = topLength;
                    const botStrokeLength = bottomLength;

                    // Find halves
                    const strokesInHalves = findHalves(newSketch, newmaxpoints, newCentroid);

                    // Find vertical distances
                    const pointWhereMax = findVerticalDistances(newPoints, newCentroid, newmaxpoints);

                    if (!pointWhereMax) {
                        document.getElementById('output').innerHTML = 'Error: Could not analyze outline properly';
                        return;
                    }

                    const maxLengthDist = newmaxpoints[0].distance(newmaxpoints[1]);
                    const ratio = maxLengthDist / pointWhereMax.maxHeight;
                    const topLengthRatio = topStrokeLength / maxLengthDist;
                    const botLengthRatio = botStrokeLength / maxLengthDist;
                    const topBotRatio = botStrokeLength > 0 ? topStrokeLength / botStrokeLength : 0;

                    console.log(rotation + "," + smoothness + "," + sharpness + "," + ratio + "," + pointWhereMax.maxLengthRatio + "," + topLengthRatio + "," + botLengthRatio + "," + topBotRatio);

                    // Predict species
                    const result = predict(smoothness, sharpness, ratio, pointWhereMax.maxLengthRatio, topLengthRatio, botLengthRatio, topBotRatio);

                    console.log(result);

                    // Determine valve side
                    let valveSide = "Left";
                    if (pointWhereMax.maxPoint.getX() > newCentroid.getX()) {
                        valveSide = "Right";
                    }

                    const speciesName = result.species || result;
                    const outputString = "Input: " + AppState.inputSpecie + "\n\nOutput:\nValve: " + valveSide + "\nClassified Species: " + speciesName;
                    document.getElementById('output').innerHTML = "<pre style='white-space: pre-wrap;'>" + outputString + "</pre>";

                } catch (error) {
                    console.error('Error during processing:', error);
                    document.getElementById('output').innerHTML = 'Error: ' + error.message;
                }
            }
        };
        // ==================== PAPER.JS INITIALIZATION ====================
        window.onload = function () {
            paper.setup('myCanvas');
            const tool = new Tool();
            AppState.path = new Path();
            AppState.userDefineMaxLength = new Path();

            tool.onMouseDown = function (event) {
                if (AppState.strokeCount === 0) {
                    AppState.userDefineMaxLength.strokeColor = 'black';
                    AppState.userDefineMaxLength.strokeWidth = 2;
                    AppState.maxLength1 = new srlib.core.data.container.Point(event.point.x, event.point.y);
                    AppState.userDefineMaxLength.add(event.point);
                } else {
                    AppState.path.strokeColor = 'red';
                    AppState.path.strokeWidth = 2;
                    AppState.stroke = new srlib.core.data.container.Stroke();
                    const point = new srlib.core.data.container.Point(event.point.x, event.point.y);
                    if (!AppState.sketch) {
                        AppState.sketch = new srlib.core.data.container.Sketch();
                    }
                    AppState.sketch.addStroke(AppState.stroke);
                    AppState.sketch.addPoint(point);
                    AppState.stroke.addPoint(point);
                }
            };

            tool.onMouseUp = function (event) {
                if (AppState.strokeCount === 0) {
                    AppState.strokeCount++;
                    AppState.maxLength2 = new srlib.core.data.container.Point(event.point.x, event.point.y);
                    AppState.userDefineMaxLength.add(event.point);
                    document.getElementById('questionlabel').innerHTML = 'Trace outline';
                }
            };

            tool.onMouseDrag = function (event) {
                if (AppState.strokeCount !== 0) {
                    AppState.path.add(event.point);
                    const point = new srlib.core.data.container.Point(event.point.x, event.point.y);
                    AppState.sketch.addPoint(point);
                    AppState.stroke.addPoint(point);
                }
            };
        };
    </script>
</body>
</html>
